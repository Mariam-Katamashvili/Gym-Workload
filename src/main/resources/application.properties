# Application name
spring.application.name=trainer-work

# MongoDB Configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=${SERVER_PORT:8081}

# JWT Secret
jwt.secret=QlU+frI0AZIvyhzA9t+NDk9boRPbSJIEv9gBViCDc6XKgJZFqzw9w5JyGVRqspJXh7toUyFWP/XA0XVsCtqy9w==

# Logging Level
logging.level.org.springframework=DEBUG

# ActiveMQ Configuration
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.activemq.packages.trust-all=true

# Messaging Configuration
messaging.jms.destination.main=${JMS_DESTINATION_MAIN:workload-queue}